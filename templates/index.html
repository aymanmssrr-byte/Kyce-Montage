<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyce Montage</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#e8e8e8;font-family:-apple-system,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px 16px}
h1{font-size:26px;font-weight:700;margin-bottom:6px;color:#fff}
.sub{font-size:13px;color:#555;margin-bottom:24px}

/* MODE BAR */
.mode-bar{display:flex;gap:0;margin-bottom:28px;background:#111;border-radius:12px;padding:4px;width:100%;max-width:420px}
.mode-btn{flex:1;padding:12px 8px;border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .25s;background:transparent;color:#666;display:flex;align-items:center;justify-content:center;gap:8px}
.mode-btn.on-green{background:#00ff6618;color:#00ff66}
.mode-btn.on-purple{background:#8b5cf618;color:#8b5cf6}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot-g{background:#00ff66}
.dot-p{background:#8b5cf6}

/* PANELS */
.panel{display:none;width:100%;max-width:500px;flex-direction:column;align-items:center}
.panel.show{display:flex}

/* DROP ZONE */
.dz{width:100%;border:2px dashed #222;border-radius:14px;padding:36px 20px;text-align:center;cursor:pointer;transition:all .25s;background:#111;margin-bottom:16px}
.dz:hover,.dz.drag{border-color:currentColor;background:rgba(255,255,255,.015)}
.dz .ico{font-size:40px;margin-bottom:10px}
.dz p{font-size:13px;color:#555;line-height:1.6}
.hl-g{color:#00ff66;font-weight:600}
.hl-p{color:#8b5cf6;font-weight:600}
.finfo{background:#111;border-radius:8px;padding:10px 14px;font-size:12px;color:#888;margin-bottom:14px;text-align:center;width:100%;display:none}

/* BUTTONS */
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;color:#fff}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-g{background:#00cc55}
.btn-p{background:#8b5cf6}

/* SUB TABS */
.stabs{display:flex;gap:2px;margin-bottom:16px;background:#111;border-radius:8px;padding:3px}
.stab{padding:6px 16px;border-radius:6px;border:none;background:transparent;color:#555;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer}
.stab.on{background:#1a1a1a;color:#ccc}

/* PROGRESS */
.prog{width:100%;margin-top:14px;display:none}
.prog.on{display:block}
.prog-track{height:4px;background:#1a1a1a;border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .3s;width:0}
.pf-g{background:#00ff66}
.pf-p{background:#8b5cf6}
.prog-lbl{font-size:12px;color:#555;text-align:center;margin-top:6px}

/* RESULTS */
.res{width:100%;margin-top:16px;display:none}
.res.on{display:block}
.rcard{background:#111;border:1px solid #1a1a1a;border-radius:12px;padding:16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.rcard .rname{font-size:13px;font-weight:600;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .rcap{font-size:11px;color:#555;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlb{padding:8px 14px;border:none;border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;color:#fff;flex-shrink:0;margin-left:10px;text-decoration:none}
.dlb-g{background:#00cc55}
.dlb-p{background:#8b5cf6}
.again{width:100%;padding:12px;border:1px solid #222;border-radius:10px;background:transparent;color:#888;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;margin-top:8px}
</style>
</head>
<body>

<h1>Kyce Montage</h1>
<p class="sub">Montage vert + Captions automatiques</p>

<!-- MODE BAR -->
<div class="mode-bar">
  <button class="mode-btn on-green" id="mGreen"><span class="dot dot-g"></span> Montage Vert</button>
  <button class="mode-btn" id="mCaption"><span class="dot dot-p"></span> Caption</button>
</div>

<!-- ═══ MONTAGE VERT ═══ -->
<div class="panel show" id="pGreen">
  <div class="dz" id="dzG" style="color:#00ff66">
    <div class="ico">🟢</div>
    <p><span class="hl-g">Clique ou glisse</span> ta video ici</p>
    <p>Upload &rarr; portal vert + caption POV</p>
    <input type="file" accept="video/*" hidden id="fG">
  </div>
  <div class="finfo" id="iG"></div>
  <button class="btn btn-g" id="goG" disabled>Lancer le montage vert</button>
  <div class="prog" id="prG"><div class="prog-track"><div class="prog-fill pf-g" id="pbG"></div></div><p class="prog-lbl" id="plG"></p></div>
  <div class="res" id="rG"></div>
</div>

<!-- ═══ CAPTION ═══ -->
<div class="panel" id="pCap">
  <div class="stabs">
    <button class="stab on" id="ts1">1 video</button>
    <button class="stab" id="tsB">Batch</button>
  </div>

  <!-- Single -->
  <div id="cS" style="width:100%;display:flex;flex-direction:column;align-items:center">
    <div class="dz" id="dzCS" style="color:#8b5cf6">
      <div class="ico">🔤</div>
      <p><span class="hl-p">Clique ou glisse</span> ta video</p>
      <p>Caption aleatoire &mdash; blanc + contour noir</p>
      <input type="file" accept="video/*" hidden id="fCS">
    </div>
    <div class="finfo" id="iCS"></div>
    <button class="btn btn-p" id="goCS" disabled>Ajouter la caption</button>
  </div>

  <!-- Batch -->
  <div id="cB" style="width:100%;display:none;flex-direction:column;align-items:center">
    <div class="dz" id="dzCB" style="color:#8b5cf6">
      <div class="ico">📦</div>
      <p><span class="hl-p">Clique ou glisse</span> tes videos</p>
      <p>Jusqu'a 50 videos &mdash; 1 caption random chacune</p>
      <input type="file" accept="video/*" multiple hidden id="fCB">
    </div>
    <div class="finfo" id="iCB"></div>
    <button class="btn btn-p" id="goCB" disabled>Lancer le batch</button>
  </div>

  <div class="prog" id="prC"><div class="prog-track"><div class="prog-fill pf-p" id="pbC"></div></div><p class="prog-lbl" id="plC"></p></div>
  <div class="res" id="rC"></div>
</div>

<script>
// ── MODE SWITCH ──
var mGreen = document.getElementById('mGreen');
var mCaption = document.getElementById('mCaption');
var pGreen = document.getElementById('pGreen');
var pCap = document.getElementById('pCap');

mGreen.onclick = function() {
  mGreen.className = 'mode-btn on-green';
  mCaption.className = 'mode-btn';
  pGreen.className = 'panel show';
  pCap.className = 'panel';
};
mCaption.onclick = function() {
  mCaption.className = 'mode-btn on-purple';
  mGreen.className = 'mode-btn';
  pCap.className = 'panel show';
  pGreen.className = 'panel';
};

// ── SUB TABS ──
var ts1 = document.getElementById('ts1');
var tsB = document.getElementById('tsB');
var cS = document.getElementById('cS');
var cB = document.getElementById('cB');

ts1.onclick = function() {
  ts1.className = 'stab on'; tsB.className = 'stab';
  cS.style.display = 'flex'; cB.style.display = 'none';
};
tsB.onclick = function() {
  tsB.className = 'stab on'; ts1.className = 'stab';
  cB.style.display = 'flex'; cS.style.display = 'none';
};

// ── DRAG/DROP HELPER ──
function setupDZ(zone, input, cb) {
  zone.onclick = function() { input.click(); };
  zone.ondragover = function(e) { e.preventDefault(); zone.classList.add('drag'); };
  zone.ondragleave = function() { zone.classList.remove('drag'); };
  zone.ondrop = function(e) { e.preventDefault(); zone.classList.remove('drag'); cb(e.dataTransfer.files); };
  input.onchange = function() { cb(input.files); };
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function dlBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// ══════════════════════════════════════
// MONTAGE VERT
// ══════════════════════════════════════
var gFile = null;
var dzG = document.getElementById('dzG');
var fG = document.getElementById('fG');
var iG = document.getElementById('iG');
var goG = document.getElementById('goG');
var prG = document.getElementById('prG');
var pbG = document.getElementById('pbG');
var plG = document.getElementById('plG');
var rG = document.getElementById('rG');

setupDZ(dzG, fG, function(files) {
  var f = files[0];
  if (f && f.type.indexOf('video') === 0) {
    gFile = f;
    iG.textContent = f.name;
    iG.style.display = 'block';
    goG.disabled = false;
  }
});

goG.onclick = function() {
  if (!gFile) return;
  goG.disabled = true;
  prG.className = 'prog on';
  rG.className = 'res';
  rG.innerHTML = '';
  pbG.style.width = '30%';
  plG.textContent = 'Montage en cours...';

  var fd = new FormData();
  fd.append('video', gFile);

  fetch('/process', { method: 'POST', body: fd })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      pbG.style.width = '100%';
      if (data.ok) {
        plG.textContent = 'Termine !';
        rG.className = 'res on';
        rG.innerHTML = '<div class="rcard"><div><div class="rname">' + esc(data.file) + '</div><div class="rcap">' + esc(data.caption) + '</div></div><a class="dlb dlb-g" href="' + data.download + '" download>Telecharger</a></div><button class="again" onclick="resetG()">Encore une</button>';
      } else {
        plG.textContent = 'Erreur: ' + data.error;
      }
    })
    .catch(function(e) { plG.textContent = 'Erreur: ' + e.message; });
};

function resetG() {
  gFile = null;
  iG.style.display = 'none';
  goG.disabled = true;
  prG.className = 'prog';
  rG.className = 'res';
  rG.innerHTML = '';
  pbG.style.width = '0';
}

// ══════════════════════════════════════
// CAPTION SINGLE
// ══════════════════════════════════════
var csFile = null;
var dzCS = document.getElementById('dzCS');
var fCS = document.getElementById('fCS');
var iCS = document.getElementById('iCS');
var goCS = document.getElementById('goCS');
var prC = document.getElementById('prC');
var pbC = document.getElementById('pbC');
var plC = document.getElementById('plC');
var rC = document.getElementById('rC');

setupDZ(dzCS, fCS, function(files) {
  var f = files[0];
  if (f && f.type.indexOf('video') === 0) {
    csFile = f;
    iCS.textContent = f.name;
    iCS.style.display = 'block';
    goCS.disabled = false;
  }
});

goCS.onclick = function() {
  if (!csFile) return;
  goCS.disabled = true;
  prC.className = 'prog on';
  rC.className = 'res';
  rC.innerHTML = '';
  pbC.style.width = '30%';
  plC.textContent = 'Ajout de la caption...';

  var fd = new FormData();
  fd.append('video', csFile);

  fetch('/caption', { method: 'POST', body: fd })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      pbC.style.width = '100%';
      if (data.ok) {
        plC.textContent = 'Termine !';
        rC.className = 'res on';
        rC.innerHTML = '<div class="rcard"><div><div class="rname">' + esc(data.file) + '</div><div class="rcap">' + esc(data.caption) + '</div></div><a class="dlb dlb-p" href="' + data.download + '" download>Telecharger</a></div><button class="again" onclick="resetC()">Encore une</button>';
      } else {
        plC.textContent = 'Erreur: ' + data.error;
      }
    })
    .catch(function(e) { plC.textContent = 'Erreur: ' + e.message; });
};

// ══════════════════════════════════════
// CAPTION BATCH
// ══════════════════════════════════════
var cbFiles = [];
var dzCB = document.getElementById('dzCB');
var fCB = document.getElementById('fCB');
var iCB = document.getElementById('iCB');
var goCB = document.getElementById('goCB');

setupDZ(dzCB, fCB, function(files) {
  var arr = [];
  for (var i = 0; i < files.length && i < 50; i++) {
    if (files[i].type.indexOf('video') === 0) arr.push(files[i]);
  }
  if (arr.length) {
    cbFiles = arr;
    iCB.textContent = arr.length + ' video' + (arr.length > 1 ? 's' : '');
    iCB.style.display = 'block';
    goCB.disabled = false;
  }
});

goCB.onclick = function() {
  if (!cbFiles.length) return;
  goCB.disabled = true;
  prC.className = 'prog on';
  rC.className = 'res';
  rC.innerHTML = '';
  pbC.style.width = '20%';
  plC.textContent = 'Upload + traitement...';

  var fd = new FormData();
  for (var i = 0; i < cbFiles.length; i++) fd.append('videos', cbFiles[i]);

  fetch('/caption-batch', { method: 'POST', body: fd })
    .then(function(r) {
      if (!r.ok) throw new Error('Erreur serveur');
      pbC.style.width = '90%';
      plC.textContent = 'Telechargement du ZIP...';
      return r.blob();
    })
    .then(function(blob) {
      dlBlob(blob, 'captions_videos.zip');
      pbC.style.width = '100%';
      plC.textContent = cbFiles.length + ' videos traitees !';
      rC.className = 'res on';
      rC.innerHTML = '<button class="again" onclick="resetC()">Encore un batch</button>';
    })
    .catch(function(e) { plC.textContent = 'Erreur: ' + e.message; });
};

function resetC() {
  csFile = null;
  cbFiles = [];
  iCS.style.display = 'none';
  iCB.style.display = 'none';
  goCS.disabled = true;
  goCB.disabled = true;
  prC.className = 'prog';
  rC.className = 'res';
  rC.innerHTML = '';
  pbC.style.width = '0';
}
</script>

</body>
</html>
