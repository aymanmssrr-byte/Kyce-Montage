<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyce Montage</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#e8e8e8;font-family:-apple-system,system-ui,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:30px 16px}

h1{font-size:26px;font-weight:700;margin-bottom:6px;color:#fff}
h1 span{color:#00ff66}
.sub{font-size:13px;color:#555;margin-bottom:24px}

/* ── MODE SELECTOR ── */
.mode-bar{
  display:flex;gap:0;margin-bottom:28px;
  background:#111;border-radius:12px;padding:4px;
  width:100%;max-width:420px;
}
.mode-btn{
  flex:1;padding:12px 8px;border:none;border-radius:10px;
  font-family:inherit;font-size:14px;font-weight:600;
  cursor:pointer;transition:all .25s;
  background:transparent;color:#666;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.mode-btn.active-green{background:#00ff6618;color:#00ff66;box-shadow:0 0 20px #00ff6610}
.mode-btn.active-purple{background:#8b5cf618;color:#8b5cf6;box-shadow:0 0 20px #8b5cf610}
.mode-btn .dot{width:8px;height:8px;border-radius:50%}
.mode-btn .dot-green{background:#00ff66}
.mode-btn .dot-purple{background:#8b5cf6}

/* ── PANELS ── */
.panel{display:none;width:100%;max-width:500px;flex-direction:column;align-items:center}
.panel.on{display:flex}

/* ── UPLOAD ZONE ── */
.dz{
  width:100%;border:2px dashed #222;border-radius:14px;
  padding:36px 20px;text-align:center;cursor:pointer;
  transition:all .25s;background:#111;margin-bottom:16px;
}
.dz:hover,.dz.drag{border-color:var(--accent);background:rgba(255,255,255,.02)}
.dz .ico{font-size:40px;margin-bottom:10px}
.dz p{font-size:13px;color:#555;line-height:1.6}
.dz .hl{font-weight:600}

.file-info{
  background:#111;border-radius:8px;padding:10px 14px;
  font-size:12px;color:#888;margin-bottom:14px;text-align:center;
  width:100%;display:none;
}

/* ── BUTTONS ── */
.btn{
  width:100%;padding:14px;border:none;border-radius:12px;
  font-family:inherit;font-size:15px;font-weight:700;
  cursor:pointer;transition:opacity .2s;color:#fff;
}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-green{background:#00cc55}
.btn-purple{background:#8b5cf6}

/* ── PROGRESS ── */
.prog{width:100%;margin-top:14px;display:none}
.prog.on{display:block}
.prog-track{height:4px;background:#1a1a1a;border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .3s;width:0}
.prog-fill-green{background:#00ff66}
.prog-fill-purple{background:#8b5cf6}
.prog-label{font-size:12px;color:#555;text-align:center;margin-top:6px}

/* ── RESULTS ── */
.results{width:100%;margin-top:16px;display:none}
.results.on{display:block}
.result-card{
  background:#111;border:1px solid #1a1a1a;border-radius:12px;
  padding:16px;margin-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;
}
.result-card .info{flex:1;min-width:0}
.result-card .fname{font-size:13px;font-weight:600;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-card .cap{font-size:11px;color:#555;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-btn{
  padding:8px 14px;border:none;border-radius:8px;
  font-family:inherit;font-size:12px;font-weight:600;
  cursor:pointer;color:#fff;flex-shrink:0;margin-left:10px;
}
.dl-green{background:#00cc55}
.dl-purple{background:#8b5cf6}

.btn-again{
  width:100%;padding:12px;border:1px solid #222;border-radius:10px;
  background:transparent;color:#888;font-family:inherit;font-size:13px;
  font-weight:500;cursor:pointer;margin-top:8px;
}

/* ── BATCH SUB-TABS ── */
.sub-tabs{display:flex;gap:2px;margin-bottom:16px;background:#111;border-radius:8px;padding:3px}
.sub-tab{
  padding:6px 16px;border-radius:6px;border:none;background:transparent;
  color:#555;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;
}
.sub-tab.on{background:#1a1a1a;color:#ccc}

/* ── CAPTION LIST ── */
details{width:100%;max-width:500px;margin-top:28px}
summary{cursor:pointer;color:#444;font-size:12px;text-align:center;list-style:none}
summary::-webkit-details-marker{display:none}
.cap-list{margin-top:10px;background:#111;border-radius:10px;max-height:240px;overflow-y:auto;border:1px solid #1a1a1a}
.cap-item{padding:8px 12px;font-size:11px;color:#666;border-bottom:1px solid #141414;white-space:pre-wrap;line-height:1.4}
.cap-item:last-child{border:none}
.cap-num{color:var(--accent);font-weight:600;margin-right:6px}
</style>
</head>
<body>

<h1>Kyce <span>Montage</span></h1>
<p class="sub">Montage vert + Captions automatiques</p>

<!-- MODE SELECTOR -->
<div class="mode-bar">
  <button class="mode-btn active-green" data-mode="green" id="btnModeGreen">
    <span class="dot dot-green"></span> Montage Vert
  </button>
  <button class="mode-btn" data-mode="caption" id="btnModeCaption">
    <span class="dot dot-purple"></span> Caption
  </button>
</div>

<!-- ════════════════════════════════════ -->
<!-- PANEL: MONTAGE VERT                 -->
<!-- ════════════════════════════════════ -->
<div class="panel on" id="panelGreen" style="--accent:#00ff66">

  <div class="dz" id="dzGreen">
    <div class="ico">🟢</div>
    <p><span class="hl" style="color:#00ff66">Clique ou glisse</span> ta vidéo</p>
    <p>Upload → portal vert + caption POV</p>
    <input type="file" accept="video/*" hidden id="fileGreen">
  </div>
  <div class="file-info" id="infoGreen"></div>
  <button class="btn btn-green" id="goGreen" disabled>Lancer le montage vert</button>

  <div class="prog" id="progGreen">
    <div class="prog-track"><div class="prog-fill prog-fill-green" id="pbarGreen"></div></div>
    <p class="prog-label" id="plabelGreen"></p>
  </div>

  <div class="results" id="resGreen"></div>
</div>

<!-- ════════════════════════════════════ -->
<!-- PANEL: CAPTION                      -->
<!-- ════════════════════════════════════ -->
<div class="panel" id="panelCaption" style="--accent:#8b5cf6">

  <div class="sub-tabs">
    <button class="sub-tab on" data-sub="single" id="subSingle">1 vidéo</button>
    <button class="sub-tab" data-sub="batch" id="subBatch">Batch</button>
  </div>

  <!-- Single -->
  <div id="capSingle" style="width:100%;display:flex;flex-direction:column;align-items:center">
    <div class="dz" id="dzCapSingle">
      <div class="ico">🔤</div>
      <p><span class="hl" style="color:#8b5cf6">Clique ou glisse</span> ta vidéo</p>
      <p>Caption aléatoire — blanc + contour noir</p>
      <input type="file" accept="video/*" hidden id="fileCapSingle">
    </div>
    <div class="file-info" id="infoCapSingle"></div>
    <button class="btn btn-purple" id="goCapSingle" disabled>Ajouter la caption</button>
  </div>

  <!-- Batch -->
  <div id="capBatch" style="width:100%;display:none;flex-direction:column;align-items:center">
    <div class="dz" id="dzCapBatch">
      <div class="ico">📦</div>
      <p><span class="hl" style="color:#8b5cf6">Clique ou glisse</span> tes vidéos</p>
      <p>Jusqu'à 50 vidéos — 1 caption random chacune</p>
      <input type="file" accept="video/*" multiple hidden id="fileCapBatch">
    </div>
    <div class="file-info" id="infoCapBatch"></div>
    <button class="btn btn-purple" id="goCapBatch" disabled>Lancer le batch</button>
  </div>

  <div class="prog" id="progCap">
    <div class="prog-track"><div class="prog-fill prog-fill-purple" id="pbarCap"></div></div>
    <p class="prog-label" id="plabelCap"></p>
  </div>

  <div class="results" id="resCap"></div>
</div>

<!-- Caption list -->
<details id="capDetails">
  <summary id="capSummary"></summary>
  <div class="cap-list" id="capList"></div>
</details>

<script>
// ── MODE SWITCHING ──
const btnGreen = document.getElementById('btnModeGreen');
const btnCaption = document.getElementById('btnModeCaption');
const panelGreen = document.getElementById('panelGreen');
const panelCap = document.getElementById('panelCaption');
const capDetails = document.getElementById('capDetails');

btnGreen.addEventListener('click', () => switchMode('green'));
btnCaption.addEventListener('click', () => switchMode('caption'));

function switchMode(mode) {
  btnGreen.className = 'mode-btn' + (mode === 'green' ? ' active-green' : '');
  btnCaption.className = 'mode-btn' + (mode === 'caption' ? ' active-purple' : '');
  panelGreen.classList.toggle('on', mode === 'green');
  panelCap.classList.toggle('on', mode === 'caption');
  capDetails.style.display = mode === 'caption' ? '' : 'none';
  updateCapList(mode);
}

// ── CAPTION LIST ──
const montCaptions = {{ montage_captions | tojson | safe }};
const capTexts = {{ caption_texts | tojson | safe }};

function updateCapList(mode) {
  const list = mode === 'green' ? montCaptions : capTexts;
  const label = mode === 'green' ? 'captions POV' : 'captions engagement';
  document.getElementById('capSummary').textContent = `Voir les ${list.length} ${label} ▾`;
  const container = document.getElementById('capList');
  container.innerHTML = list.map((c, i) =>
    `<div class="cap-item"><span class="cap-num">${i+1}</span>${esc(c)}</div>`
  ).join('');
}
updateCapList('green');
capDetails.style.display = 'none';

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

// ── CAPTION SUB-TABS ──
const subSingle = document.getElementById('subSingle');
const subBatch = document.getElementById('subBatch');
const capSingleDiv = document.getElementById('capSingle');
const capBatchDiv = document.getElementById('capBatch');

subSingle.addEventListener('click', () => {
  subSingle.classList.add('on'); subBatch.classList.remove('on');
  capSingleDiv.style.display = 'flex'; capBatchDiv.style.display = 'none';
});
subBatch.addEventListener('click', () => {
  subBatch.classList.add('on'); subSingle.classList.remove('on');
  capBatchDiv.style.display = 'flex'; capSingleDiv.style.display = 'none';
});

// ── UPLOAD HELPERS ──
function setupDrop(zone, input, onFile) {
  zone.addEventListener('click', () => input.click());
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('drag');
    onFile(e.dataTransfer.files);
  });
  input.addEventListener('change', () => onFile(input.files));
}

// ── MONTAGE VERT ──
let greenFile = null;
const dzG = document.getElementById('dzGreen');
const fG = document.getElementById('fileGreen');
const infoG = document.getElementById('infoGreen');
const goG = document.getElementById('goGreen');
const progG = document.getElementById('progGreen');
const pbarG = document.getElementById('pbarGreen');
const plabelG = document.getElementById('plabelGreen');
const resG = document.getElementById('resGreen');

setupDrop(dzG, fG, files => {
  const f = files[0];
  if (f && f.type.startsWith('video/')) {
    greenFile = f;
    infoG.textContent = f.name;
    infoG.style.display = 'block';
    goG.disabled = false;
  }
});

goG.addEventListener('click', async () => {
  if (!greenFile) return;
  goG.disabled = true;
  progG.classList.add('on');
  resG.classList.remove('on');
  resG.innerHTML = '';
  pbarG.style.width = '30%';
  plabelG.textContent = 'Montage en cours...';

  const fd = new FormData();
  fd.append('video', greenFile);

  try {
    const res = await fetch('/process', { method: 'POST', body: fd });
    const data = await res.json();
    pbarG.style.width = '100%';

    if (data.ok) {
      plabelG.textContent = 'Terminé !';
      resG.classList.add('on');
      resG.innerHTML = `
        <div class="result-card">
          <div class="info">
            <div class="fname">${data.file}</div>
            <div class="cap">${esc(data.caption)}</div>
          </div>
          <a class="dl-btn dl-green" href="${data.download}" download>Télécharger</a>
        </div>
        <button class="btn-again" onclick="resetGreen()">Encore une</button>
      `;
    } else {
      plabelG.textContent = 'Erreur: ' + data.error;
    }
  } catch (e) {
    plabelG.textContent = 'Erreur: ' + e.message;
  }
});

function resetGreen() {
  greenFile = null;
  infoG.style.display = 'none';
  goG.disabled = true;
  progG.classList.remove('on');
  resG.classList.remove('on');
  resG.innerHTML = '';
  pbarG.style.width = '0';
}

// ── CAPTION SINGLE ──
let capSingleFile = null;
const dzCS = document.getElementById('dzCapSingle');
const fCS = document.getElementById('fileCapSingle');
const infoCS = document.getElementById('infoCapSingle');
const goCS = document.getElementById('goCapSingle');
const progC = document.getElementById('progCap');
const pbarC = document.getElementById('pbarCap');
const plabelC = document.getElementById('plabelCap');
const resC = document.getElementById('resCap');

setupDrop(dzCS, fCS, files => {
  const f = files[0];
  if (f && f.type.startsWith('video/')) {
    capSingleFile = f;
    infoCS.textContent = f.name;
    infoCS.style.display = 'block';
    goCS.disabled = false;
  }
});

goCS.addEventListener('click', async () => {
  if (!capSingleFile) return;
  goCS.disabled = true;
  progC.classList.add('on');
  resC.classList.remove('on');
  resC.innerHTML = '';
  pbarC.style.width = '30%';
  plabelC.textContent = 'Ajout de la caption...';

  const fd = new FormData();
  fd.append('video', capSingleFile);

  try {
    const res = await fetch('/caption', { method: 'POST', body: fd });
    const data = await res.json();
    pbarC.style.width = '100%';

    if (data.ok) {
      plabelC.textContent = 'Terminé !';
      resC.classList.add('on');
      resC.innerHTML = `
        <div class="result-card">
          <div class="info">
            <div class="fname">${data.file}</div>
            <div class="cap">${esc(data.caption)}</div>
          </div>
          <a class="dl-btn dl-purple" href="${data.download}" download>Télécharger</a>
        </div>
        <button class="btn-again" onclick="resetCap()">Encore une</button>
      `;
    } else {
      plabelC.textContent = 'Erreur: ' + data.error;
    }
  } catch (e) {
    plabelC.textContent = 'Erreur: ' + e.message;
  }
});

// ── CAPTION BATCH ──
let capBatchFiles = [];
const dzCB = document.getElementById('dzCapBatch');
const fCB = document.getElementById('fileCapBatch');
const infoCB = document.getElementById('infoCapBatch');
const goCB = document.getElementById('goCapBatch');

setupDrop(dzCB, fCB, files => {
  const arr = Array.from(files).filter(f => f.type.startsWith('video/')).slice(0, 50);
  if (arr.length) {
    capBatchFiles = arr;
    infoCB.textContent = arr.length + ' vidéo' + (arr.length > 1 ? 's' : '');
    infoCB.style.display = 'block';
    goCB.disabled = false;
  }
});

goCB.addEventListener('click', async () => {
  if (!capBatchFiles.length) return;
  goCB.disabled = true;
  progC.classList.add('on');
  resC.classList.remove('on');
  resC.innerHTML = '';
  pbarC.style.width = '20%';
  plabelC.textContent = 'Upload + traitement...';

  const fd = new FormData();
  capBatchFiles.forEach(f => fd.append('videos', f));

  try {
    const res = await fetch('/caption-batch', { method: 'POST', body: fd });
    if (!res.ok) throw new Error('Erreur serveur');
    pbarC.style.width = '90%';
    plabelC.textContent = 'Téléchargement du ZIP...';
    const blob = await res.blob();
    dlBlob(blob, 'captions_videos.zip');
    pbarC.style.width = '100%';
    plabelC.textContent = capBatchFiles.length + ' vidéos traitées !';
    resC.classList.add('on');
    resC.innerHTML = `<button class="btn-again" onclick="resetCap()">Encore un batch</button>`;
  } catch (e) {
    plabelC.textContent = 'Erreur: ' + e.message;
  }
});

function resetCap() {
  capSingleFile = null;
  capBatchFiles = [];
  infoCS.style.display = 'none';
  infoCB.style.display = 'none';
  goCS.disabled = true;
  goCB.disabled = true;
  progC.classList.remove('on');
  resC.classList.remove('on');
  resC.innerHTML = '';
  pbarC.style.width = '0';
}

function dlBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
</script>

</body>
</html>
